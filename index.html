<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Jogo da Velha</h1>
        
        <div class="scoreboard">
            <div class="score-card player-x">
                <span>Jogador X</span>
                <span id="scoreX">0</span>
            </div>
            <div class="score-card ties">
                <span>Empates</span>
                <span id="scoreTies">0</span>
            </div>
            <div class="score-card player-o">
                <span>Jogador O</span>
                <span id="scoreO">0</span>
            </div>
        </div>

        <div class="status-container">
            <p id="statusText">Vez do jogador <span class="highlight">X</span></p>
        </div>
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <button id="resetBtn">Reiniciar Partida</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
